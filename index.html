<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="preconnect"
      href="https://googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link

      href="./src/styles/main.scss"
    />
    <script

      defer
    ></script>

        <a href="#">
          <img
            src="src/images/MyBiKE.png"

          />
        </a>
        <div class="header__icons">
          <a

          <a

      </div>
      <div class="header__bottom">

    <aside

      <div class="menu__content">
        <div class="top-bar">
          <a href="#">
            <img
              src="src/images/MyBiKE.png"

            <li class="nav__item">

            <li class="nav__item">
              <a
                class="nav__link"
                href="#MoveFree"
              >
                Move Free
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#Comparebikes"

                Compare bikes
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"

              >
                The details
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#Contactus"
              >
                Contact us
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <a
        href="tel:+1 234 5555-55-55"
        class="menu__phone-number"
      >
        +1 234 5555-55-55
      </a>
      <a
        href="tel:+1 234 5555-55-55"
        class="menu__call-to-order"

        Call to order
      </a>

    <main class="main">
      <section
        class="MoveFree"
        id="MoveFree"
      >
        <h2>Move Free</h2>
      </section>

      <section
        class="Comparebikes"
        id="Comparebikes"
      >
        <h2>Compare bikes</h2>
      </section>

      <section
        class="Thedetails"
        id="Thedetails"
      >
        <h2>The details</h2>
      </section>

      <section
        class="Contactus"
        id="Contactus"
      >
        <h2>Contact us</h2>
      </section>
